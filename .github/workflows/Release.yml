name: Release

on:
  push:
    branches:
      - main

permissions: {}

# Allow one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'ota-meshi/eslint-plugin-toml'
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # npm 10's Arborist crashes on tsdown's nested optional peer dependencies.
      # npm 11.10.1+ includes the upstream fix: https://github.com/npm/cli/pull/8981
      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0
      - name: Install Dependencies
        run: npm install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # this expects you to have a npm script called version that runs some logic and then calls `changeset version`.
          version: npm run version:ci
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: npm run release
          commit: "chore: release eslint-plugin-toml"
          title: "chore: release eslint-plugin-toml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
